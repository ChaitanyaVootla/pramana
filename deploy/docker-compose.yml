# Runs on the Hetzner box in /opt/pramana. Caddy (movie-browser stack) proxies
# pramana.vootlachaitanya.com to 127.0.0.1:3700. Sign-in is Google (PRAMANA_AUTH in .env).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pramana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pramana
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=30", "-c", "work_mem=8MB"]
    mem_limit: 400m
    shm_size: 128m
    volumes:
      - /var/lib/pramana/pg:/var/lib/postgresql
  web:
    image: pramana-web:latest
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pramana:${POSTGRES_PASSWORD}@db:5432/pramana
      PRAMANA_DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=640
    mem_limit: 900m
    ports:
      - "127.0.0.1:3700:3000"
    volumes:
      - /var/lib/pramana/data:/data
